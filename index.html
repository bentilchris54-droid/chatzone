
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChatZone</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
    }

    header {
      padding: 16px;
      background: #172338;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h2 { margin: 0; color: #63a4ff; }

    main {
      max-width: 650px;
      margin: 25px auto;
      padding: 15px;
    }

    .card {
      background: #1b2940;
      padding: 22px;
      border-radius: 14px;
    }

    button, input {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      border: 0;
      cursor: pointer;
      background: #3878e8;
      color: white;
    }

    .google { background: white; color: #222; }
    .secondary { background: #34445e; }

    input {
      border: 1px solid #42516a;
      background: #101827;
      color: white;
    }

    #messages {
      height: 300px;
      overflow-y: auto;
      background: #101827;
      border-radius: 8px;
      padding: 12px;
      margin-top: 15px;
    }

    .message {
      padding: 9px;
      margin-bottom: 8px;
      background: #24344d;
      border-radius: 8px;
      overflow-wrap: anywhere;
    }

    .message strong { color: #83b5ff; }
    .small { color: #bdc8da; font-size: 14px; }
    #chat, #profile { display: none; }
    #status { color: #bdc8da; }
  </style>
</head>

<body>
<header>
  <h2>ChatZone</h2>
  <span>💬</span>
</header>

<main>
  <section class="card" id="welcome">
    <h1>Welcome to ChatZone</h1>
    <p>Meet people, make friends, and enjoy conversations.</p>
    <button class="google" id="googleBtn">Continue with Google</button>
    <p id="status">Sign in to get started.</p>
  </section>

  <section class="card" id="profile">
    <h2>Choose your nickname</h2>
    <p class="small">This is the name other people will see.</p>
    <input id="nickname" maxlength="20" placeholder="Enter a nickname">
    <button id="saveNameBtn">Continue to chat</button>
  </section>

  <section class="card" id="chat">
    <p id="userInfo"></p>
    <button class="secondary" id="signOutBtn">Sign out</button>
    <h2>General Chat</h2>
    <div id="messages"></div>
    <input id="messageInput" maxlength="500"
      placeholder="Write a message...">
    <button id="sendBtn">Send message</button>
    <p class="small">Be respectful. Don't share personal information.</p>
  </section>
</main>

<script type="module">
  import { initializeApp } from
    "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";

  import {
    getAuth,
    GoogleAuthProvider,
    signInWithRedirect,
    getRedirectResult,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

  import {
    getDatabase,
    ref,
    set,
    push,
    onValue,
    query,
    limitToLast
  } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBLjm_Fm3rf6xArbVQm8NsHeMZAQAtYho8",
    authDomain: "gamersnet-b9c7d.firebaseapp.com",
    databaseURL: "https://gamersnet-b9c7d-default-rtdb.firebaseio.com",
    projectId: "gamersnet-b9c7d",
    storageBucket: "gamersnet-b9c7d.firebasestorage.app",
    messagingSenderId: "706719567863",
    appId: "1:706719567863:web:c45901a666cea84b5368f2",
    measurementId: "G-L3QQF7E0WZ"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);
  const provider = new GoogleAuthProvider();

  const welcome = document.getElementById("welcome");
  const profile = document.getElementById("profile");
  const chat = document.getElementById("chat");
  const status = document.getElementById("status");
  const nicknameInput = document.getElementById("nickname");
  const messageInput = document.getElementById("messageInput");
  const messagesDiv = document.getElementById("messages");

  let currentUser = null;
  let currentNickname = "";
  let stopListening = null;

  function showStatus(message) {
    status.textContent = message;
  }

  document.getElementById("googleBtn").onclick = async () => {
    try {
      showStatus("Opening Google Sign-In...");
      await signInWithRedirect(auth, provider);
    } catch (error) {
      showStatus(error.message);
    }
  };

  try {
    await getRedirectResult(auth);
  } catch (error) {
    showStatus("Sign-in error: " + error.message);
  }

  onAuthStateChanged(auth, async user => {
    currentUser = user;

    if (!user) {
      welcome.style.display = "block";
      profile.style.display = "none";
      chat.style.display = "none";
      return;
    }

    welcome.style.display = "none";
    chat.style.display = "none";

    try {
      const response = await fetch(
        "https://gamersnet-b9c7d-default-rtdb.firebaseio.com/profiles/"
        + user.uid + "/nickname.json"
      );

      const savedNickname = await response.json();

      if (typeof savedNickname === "string" && savedNickname.length > 0) {
        currentNickname = savedNickname;
        openChat();
      } else {
        profile.style.display = "block";
      }
    } catch (error) {
      profile.style.display = "block";
    }
  });

  document.getElementById("saveNameBtn").onclick = async () => {
    if (!currentUser) return;

    const name = nicknameInput.value.trim();

    if (name.length < 2 || name.length > 20) {
      alert("Your nickname must be 2 to 20 characters.");
      return;
    }

    try {
      await set(ref(db, "profiles/" + currentUser.uid), {
        nickname: name
      });

      currentNickname = name;
      openChat();
    } catch (error) {
      alert("Could not save nickname: " + error.message);
    }
  };

  function openChat() {
    welcome.style.display = "none";
    profile.style.display = "none";
    chat.style.display = "block";

    document.getElementById("userInfo").textContent =
      "Signed in as " + currentNickname;

    if (stopListening) stopListening();

    const messagesQuery = query(
      ref(db, "messages"),
      limitToLast(50)
    );

    stopListening = onValue(messagesQuery, snapshot => {
      messagesDiv.replaceChildren();

      snapshot.forEach(child => {
        const message = child.val();

        if (!message || typeof message.text !== "string") return;

        const item = document.createElement("div");
        item.className = "message";

        const name = document.createElement("strong");
        name.textContent = message.nickname || "User";

        const text = document.createElement("div");
        text.textContent = message.text;

        item.append(name, text);
        messagesDiv.appendChild(item);
      });

      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    });
  }

  document.getElementById("sendBtn").onclick = async () => {
    if (!currentUser || !currentNickname) return;

    const text = messageInput.value.trim();

    if (!text || text.length > 500) return;

    try {
      await push(ref(db, "messages"), {
        uid: currentUser.uid,
        nickname: currentNickname,
        text: text,
        createdAt: Date.now()
      });

      messageInput.value = "";
    } catch (error) {
      alert("Message could not be sent: " + error.message);
    }
  };

  document.getElementById("signOutBtn").onclick = async () => {
    if (stopListening) stopListening();
    await signOut(auth);
  };
</script>
</body>
</html>
